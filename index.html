<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Expense Tracker</h1>
    <p class="subtitle">Track your daily spending easily.</p>

    <section class="summary">
      <div class="card">
        <span>Total Spent</span>
        <strong id="total">₹0</strong>
      </div>
      <div class="card">
        <span>This Month</span>
        <strong id="monthTotal">₹0</strong>
      </div>
    </section>

    <form id="expenseForm" class="form">
      <input id="title" type="text" placeholder="Expense name" required>
      <input id="amount" type="number" min="1" step="0.01" placeholder="Amount (₹)" required>
      <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Education</option>
        <option>Other</option>
      </select>
      <input id="date" type="date" required>
      <button type="submit">Add Expense</button>
    </form>

    <section>
      <h2>Expenses</h2>
      <div id="empty" class="empty">No expenses added yet.</div>
      <ul id="expenseList"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
